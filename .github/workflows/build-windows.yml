name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (MSI + NSIS)
        # `npm run tauri -- build ...` forwards everything after `--` to the Tauri CLI.
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Collect bundle info
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          if (Test-Path $bundle) {
            Write-Host "Bundle contents:"
            Get-ChildItem -Recurse -File $bundle |
              Select-Object @{ n = 'File'; e = { $_.FullName } }, @{ n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 2) } } |
              Format-Table -AutoSize
          } else {
            Write-Host "No bundle directory found at $bundle"
          }

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: qchat-miniapp-studio-windows-msi
          # Explicit --target puts bundles under target/<triple>/release; the plain
          # path is listed too so the step also works without --target.
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: qchat-miniapp-studio-windows-nsis
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: qchat-miniapp-studio-windows-portable
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 14
