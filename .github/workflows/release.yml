name: Build & Release (multi-platform)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage bundled Node.js runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Split-Path (Get-Command node).Source -Parent
          $dest = "src-tauri/resources/node"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$src\*" $dest -Recurse -Force
          foreach ($junk in @(
            "node_modules\corepack",
            "node_modules\npm\docs",
            "node_modules\npm\man",
            "node_modules\npm\test",
            "nodevars.bat",
            "install_tools.bat",
            "node_etw_provider.man",
            "CHANGELOG.md",
            "LICENSE",
            "README.md"
          )) {
            Remove-Item (Join-Path $dest $junk) -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "$dest\node.exe")) { throw "node.exe was not staged" }
          Write-Host "Staged Node.js $(& node --version) at $dest"

      - name: Build Tauri app + create release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QChat Mini App Studio v__VERSION__"
          releaseBody: |
            Build tự động đa nền tảng cho QChat Mini App Studio.
            - Windows: `.msi` / `.exe` (NSIS)
            - macOS: `.dmg`
            - Linux: `.AppImage` / `.deb`
          releaseDraft: true
          prerelease: false
